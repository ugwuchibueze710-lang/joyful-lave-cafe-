# Render Blueprint — Joy-Full Java + Juice website + online ordering (pay at pickup)
services:
  - type: web
    name: joyful-java-juice
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TAX_RATE
        value: "0.06"
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_PASSWORD   # you type this in Render (dashboard sign-in)
        sync: false
      - key: DATABASE_URL     # Supabase → Connect → Session pooler connection string
        sync: false
